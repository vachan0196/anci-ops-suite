name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    env:
      ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker compose -f infra/docker-compose.yml build api

      - name: Run migrations
        run: docker compose -f infra/docker-compose.yml run --rm -e ENV=test api sh -lc "alembic -c apps/api/alembic.ini upgrade head"

      - name: Run backend tests
        run: docker compose -f infra/docker-compose.yml run --rm -e ENV=test -e RATE_LIMIT_ENABLED=false api sh -lc "PYTHONPATH=/app pytest -q"

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      # H149: both dependency audits carry `if: always()` so a failure in one
      # cannot skip the other. Each still fails the build on its own.
      - name: Python dependency audit
        if: always()
        run: |
          python -m pip install --upgrade pip pip-audit
          # PYSEC-2026-1325 (ecdsa 0.19.2, Minerva P-256 timing attack) is
          # accepted, not fixed: upstream states no fix is planned, ecdsa is an
          # unconditional requirement of python-jose under this repository's
          # ordinary resolver and install model, so removing it would mean
          # changing that model, and the vulnerable path is unreachable here
          # because python-jose binds all four key classes to its cryptography
          # backend. The acceptance, its evidence and its re-review triggers
          # are recorded in HARDENING_BACKLOG.md H147 R-2; the rule permitting
          # a suppression at all is DECISIONS.md D066.
          pip-audit -r apps/api/requirements.txt --ignore-vuln PYSEC-2026-1325

      - name: npm dependency audit
        if: always()
        working-directory: apps/web
        run: npm audit --audit-level=high
